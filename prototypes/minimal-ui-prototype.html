<!doctype html>
<!-- THROWAWAY UI PROTOTYPE: three minimal shells, switchable with ?variant=google|github|docs. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minimal map UI study</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24292f;background:#f6f8fa}.bar{height:64px;display:flex;align-items:center;gap:18px;padding:0 20px;background:#fff;border-bottom:1px solid #d0d7de}.brand{font-weight:650}.search{height:40px;max-width:520px;flex:1;margin:auto;padding:0 12px;border:1px solid #8c959f;border-radius:7px}.map{height:calc(100vh - 64px);position:relative;overflow:hidden;background:linear-gradient(30deg,#eaf2ff,#f6f8fa 40%,#e9f7ee)}.land{position:absolute;border:2px solid #8bb5ed;border-radius:44% 56% 48% 52%;background:#eaf2ff}.one{width:38%;height:48%;left:9%;top:16%}.two{width:34%;height:42%;right:8%;bottom:12%;border-color:#b79ae5;background:#f3edff}.node{position:absolute;padding:7px 10px;border:1px solid #d0d7de;border-radius:7px;background:#fff;box-shadow:0 1px 2px #1f23280d}.n1{left:27%;top:33%}.n2{left:47%;top:46%}.n3{right:22%;bottom:31%}.path{position:absolute;left:32%;top:40%;width:43%;height:3px;background:#0969da;transform:rotate(20deg);transform-origin:left}.panel{position:absolute;top:18px;bottom:18px;width:360px;padding:20px;background:#fff;border:1px solid #d0d7de;border-radius:10px;box-shadow:0 8px 24px #8c959f33}.panel h2{margin:0 0 5px}.panel p{color:#57606a;line-height:1.5}.step{padding:14px 0;border-bottom:1px solid #eaeef2}.google .panel{left:18px}.github .bar{background:#24292f;color:#fff}.github .search{background:#fff}.github .panel{left:0;top:0;bottom:0;border-radius:0;border-width:0 1px 0 0}.docs .panel{right:18px;width:410px}.docs .map{background:#fff}.switch{position:fixed;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:7px;border-radius:999px;background:#24292f;color:#fff;box-shadow:0 6px 20px #0003}.switch button{width:36px;height:36px;border:0;border-radius:50%;color:#fff;background:#424a53;cursor:pointer}.switch span{min-width:170px;text-align:center;font-weight:600}
</style></head><body><header class="bar"><span class="brand">Data Science Universe</span><input class="search" placeholder="Search concepts and regions"><span>Directions</span></header><main class="map"><div class="land one"></div><div class="land two"></div><div class="path"></div><span class="node n1">Probability</span><span class="node n2">Causal Inference</span><span class="node n3">Causal Graphs</span><aside class="panel"><h2>Directions</h2><p>Probability → Causal Graphs</p><div class="step"><b>1 · Probability</b></div><div class="step"><b>2 · Causal Inference</b><p>Learn next</p></div><div class="step"><b>3 · Causal Graphs</b><p>Enter subfield</p></div></aside></main><nav class="switch"><button id="prev">←</button><span id="label"></span><button id="next">→</button></nav><script>
const variants=['google','github','docs'];const names={google:'Google utility shell',github:'GitHub explorer shell',docs:'Documentation-first shell'};let current=new URLSearchParams(location.search).get('variant')||'google';function draw(){document.body.className=current;document.querySelector('#label').textContent=names[current];history.replaceState(null,'','?variant='+current)}function cycle(step){current=variants[(variants.indexOf(current)+step+variants.length)%variants.length];draw()}prev.onclick=()=>cycle(-1);next.onclick=()=>cycle(1);addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});draw();
</script></body></html>
