<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PROTOTYPE — Knowledge Route Logic</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,sans-serif;background:#09121d;color:#f4ead3}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:960px;margin:auto}h1{font:600 28px Georgia,serif;margin:0 0 8px}.intro{color:#b8c2cb;line-height:1.6;max-width:760px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.card{background:#111e2b;border:1px solid #304253;border-radius:14px;padding:20px}label{display:block;font-size:13px;color:#9fb0bd;margin:12px 0 6px}select,button{width:100%;min-height:44px;border-radius:9px;border:1px solid #405567;background:#0b1723;color:#f4ead3;padding:10px 12px;font-size:15px}button{cursor:pointer;background:#765b21;border-color:#a88a45;font-weight:650;margin-top:12px}.state{display:grid;gap:10px}.state div{background:#09141f;border-radius:8px;padding:12px}.state small{display:block;color:#91a5b4;margin-bottom:4px}.steps{margin:12px 0 0;padding-left:22px;line-height:1.8}.tabs{display:flex;gap:8px;margin-top:24px}.tabs button{width:auto;margin:0;background:#142434}.tabs button.active{background:#765b21}.scenario{margin-top:12px}.scenario button{width:auto;margin-right:8px}.wide{grid-column:1/-1}@media(max-width:700px){body{padding:18px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>PROTOTYPE — Knowledge Route Logic</h1>
  <p class="intro">问题：当学习者选择两个 Concept 时，路线应如何同时利用 prerequisite 与 part-of？本原型验证的规则是：优先沿 prerequisite 向前学习；层级关系可双向通行；若目标位于基础方向，则允许沿 prerequisite 反向回顾，但代价更高。</p>
  <div class="grid">
    <section class="card">
      <h2>自由探索</h2>
      <label for="start">起点</label><select id="start"></select>
      <label for="end">终点</label><select id="end"></select>
      <button id="route">寻找路线</button>
    </section>
    <section class="card">
      <h2>当前状态</h2>
      <div id="state" class="state"></div>
    </section>
    <section class="card wide">
      <h2>引导场景</h2>
      <div class="tabs" id="tabs"></div>
      <div class="scenario" id="scenario"></div>
    </section>
  </div>
  <script>
    const concepts={stats:'Statistics',prob:'Probability',ml:'Machine Learning',causal:'Causal Inference',dag:'Causal Graphs',reg:'Regression',ds:'Data Science',nn:'Neural Networks'};
    const relations=[
      ['prob','stats','prerequisite_of'],['stats','ml','prerequisite_of'],['stats','causal','prerequisite_of'],
      ['reg','ml','part_of'],['dag','causal','part_of'],['ml','ds','part_of'],['causal','ds','part_of'],['nn','ml','part_of']
    ];
    const scenarios=[
      {name:'向前学习',note:'从 Probability 到 Causal Graphs：应优先沿 prerequisite 前进，再进入子领域。',start:'prob',end:'dag'},
      {name:'跨领域',note:'从 Neural Networks 到 Causal Graphs：应先返回共同上层 Data Science，再进入目标领域。',start:'nn',end:'dag'},
      {name:'回顾基础',note:'从 Machine Learning 到 Probability：没有正向学习边时，允许反向回顾 prerequisite。',start:'ml',end:'prob'}
    ];
    function graph(){const g=new Map(Object.keys(concepts).map(id=>[id,[]]));for(const [a,b,type] of relations){if(type==='prerequisite_of'){g.get(a).push({to:b,kind:'learn_next',cost:1});g.get(b).push({to:a,kind:'review_foundation',cost:2.2})}else{g.get(a).push({to:b,kind:'zoom_out',cost:.65});g.get(b).push({to:a,kind:'enter_detail',cost:.8})}}return g}
    function findRoute(start,end){if(start===end)return{ids:[start],steps:[],cost:0};const g=graph(),dist=new Map([[start,0]]),prev=new Map(),open=[start];while(open.length){open.sort((a,b)=>dist.get(a)-dist.get(b));const id=open.shift();if(id===end)break;for(const edge of g.get(id)){const next=dist.get(id)+edge.cost;if(next<(dist.get(edge.to)??Infinity)){dist.set(edge.to,next);prev.set(edge.to,{from:id,kind:edge.kind});if(!open.includes(edge.to))open.push(edge.to)}}}if(!prev.has(end))return null;const ids=[end],steps=[];let cursor=end;while(cursor!==start){const item=prev.get(cursor);steps.unshift({from:item.from,to:cursor,kind:item.kind});cursor=item.from;ids.unshift(cursor)}return{ids,steps,cost:dist.get(end)}}
    const labels={learn_next:'继续学习',review_foundation:'回看基础',zoom_out:'返回上层领域',enter_detail:'进入子领域'};
    const start=document.querySelector('#start'),end=document.querySelector('#end'),state=document.querySelector('#state');
    for(const [id,name] of Object.entries(concepts)){start.add(new Option(name,id));end.add(new Option(name,id))}start.value='prob';end.value='dag';
    function render(){const result=findRoute(start.value,end.value);state.innerHTML=result?`<div><small>起点 → 终点</small>${concepts[start.value]} → ${concepts[end.value]}</div><div><small>路线</small>${result.ids.map(id=>concepts[id]).join(' → ')}</div><div><small>步骤与完整状态</small><ol class="steps">${result.steps.map(step=>`<li>${labels[step.kind]}：${concepts[step.from]} → ${concepts[step.to]}</li>`).join('')}</ol><small>weighted cost: ${result.cost.toFixed(2)}</small></div>`:'<div>这两个概念之间暂时没有可验证的路线。</div>'}
    document.querySelector('#route').onclick=render;
    const tabs=document.querySelector('#tabs'),scenario=document.querySelector('#scenario');
    function chooseScenario(index){[...tabs.children].forEach((button,i)=>button.classList.toggle('active',i===index));const item=scenarios[index];scenario.innerHTML=`<p>${item.note}</p><button id="run">载入并运行这个场景</button>`;document.querySelector('#run').onclick=()=>{start.value=item.start;end.value=item.end;render()}}
    scenarios.forEach((item,index)=>{const button=document.createElement('button');button.textContent=item.name;button.onclick=()=>chooseScenario(index);tabs.append(button)});chooseScenario(0);render();
  </script>
</body>
</html>
